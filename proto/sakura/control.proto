syntax = "proto3";

package sakura.control.v1;

// This is the transport-neutral control contract between a web-facing agent
// service and a Sakura machine adapter. It is intentionally separate from
// HTTP/WebSocket framing: the same messages can travel over either.
// The initial local Unix-socket adapter uses a four-byte big-endian length
// prefix around each serialized message.

message Group {
  string id = 1;
  string parent_id = 2;
  string title = 3;
  string directory = 4;
  uint32 order = 5;
  bool archived = 6;
}

message Task {
  string id = 1;
  string parent_id = 2;
  string group_id = 3;
  string title = 4;
  string provider = 5;
  string external_id = 6;
  string url = 7;
  uint32 status = 8;
  uint32 order = 9;
  bool archived = 10;
}

message Terminal {
  string id = 1;
  string group_id = 2;
  string task_id = 3;
  string cwd = 4;
  string title = 5;
  uint32 cols = 6;
  uint32 rows = 7;
  uint32 status = 8;
}

message Page {
  string id = 1;
  string group_id = 2;
  string task_id = 3;
  string title = 4;
  bool title_set_by_user = 5;
  bool archived = 6;
  string root_layout_id = 7;
  string active_terminal_id = 8;
}

message WorkspaceSnapshot {
  repeated Group groups = 1;
  repeated Task tasks = 2;
  string active_group_id = 3;
  string active_task_id = 4;
  string root_directory = 5;
  uint64 sequence = 6;
  repeated Terminal terminals = 7;
  repeated Page pages = 8;
  uint64 workspace_revision = 9;
}

message EntityRef {
  string kind = 1;
  string id = 2;
}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  uint64 current_revision = 4;
}

message GetSnapshotRequest {}

message HelloRequest {
  uint32 protocol_version = 1;
  string client_name = 2;
  string workspace_id = 3;
}

message CreateGroupRequest {
  string parent_id = 1;
  string title = 2;
  string directory = 3;
}

message UpdateGroupRequest {
  string group_id = 1;
  string title = 2;
  string directory = 3;
}

message MoveGroupRequest {
  string group_id = 1;
  string parent_id = 2;
  string target_id = 3;
  bool after = 4;
}

// File paths are always relative to the selected worktree. The agent owns
// the worktree-to-directory mapping and must reject paths that escape it.
message FileEntry {
  string path = 1;
  string name = 2;
  bool directory = 3;
  uint64 size = 4;
  int64 modified_unix = 5;
  bool readonly = 6;
  string version = 7;
}

message ListFilesRequest {
  string worktree_id = 1;
  string path = 2;
}

message ReadFileRequest {
  string worktree_id = 1;
  string path = 2;
  uint64 offset = 3;
  uint64 length = 4;
  bool has_length = 5;
  string expected_version = 6;
}

message WriteFileRequest {
  string worktree_id = 1;
  string path = 2;
  bytes data = 3;
  string expected_version = 4;
  bool truncate = 5;
}

message SetGroupArchivedRequest {
  string group_id = 1;
  bool archived = 2;
}

message DeleteGroupRequest {
  string group_id = 1;
}

message CreateTaskRequest {
  string group_id = 1;
  string parent_id = 2;
  string title = 3;
  string provider = 4;
  string external_id = 5;
  string url = 6;
}

message UpdateTaskRequest {
  string task_id = 1;
  string title = 2;
}

message MoveTaskRequest {
  string task_id = 1;
  string group_id = 2;
  string parent_id = 3;
  string target_id = 4;
  bool after = 5;
}

message UpdatePageRequest {
  string page_id = 1;
  string group_id = 2;
  string task_id = 3;
  string title = 4;
  bool title_set_by_user = 5;
  bool archived = 6;
}

// Structural page ownership is intentionally separate from page metadata.
// Metadata updates must never be able to move a page as a side effect.
message MovePageRequest {
  string page_id = 1;
  string group_id = 2;
  string task_id = 3;
}

message RenamePageRequest {
  string page_id = 1;
  string title = 2;
  bool title_set_by_user = 3;
}

message SetPageArchivedRequest {
  string page_id = 1;
  bool archived = 2;
}

message SetTaskStatusRequest {
  string task_id = 1;
  uint32 status = 2;
}

message DeletePageRequest {
  string page_id = 1;
}

message SetTaskArchivedRequest {
  string task_id = 1;
  bool archived = 2;
}

message DeleteTaskRequest {
  string task_id = 1;
}

message CreateTerminalRequest {
  string group_id = 1;
  string task_id = 2;
  string cwd = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  string terminal_id = 6;
  string page_id = 7;
}

message CreateCodexRequest {
  string group_id = 1;
  string task_id = 2;
  string cwd = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  string terminal_id = 6;
  string page_id = 7;
  string reasoning_effort = 8;
  string resume_session_id = 9;
}

message TerminalInput {
  string terminal_id = 1;
  bytes data = 2;
}

message TerminalResize {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message CloseSessionRequest {
  string terminal_id = 1;
}

message AttachTerminalRequest {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  uint64 after_output_offset = 4;
  bool has_after_output_offset = 5;
}

message DetachTerminalRequest {
  string terminal_id = 1;
}

message RestartTerminalRequest {
  string terminal_id = 1;
  string group_id = 2;
  string task_id = 3;
  string cwd = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  string page_id = 7;
}

message SubscribeEventsRequest {
  uint64 after_sequence = 1;
}

message Request {
  string request_id = 1;
  oneof body {
    GetSnapshotRequest get_snapshot = 2;
    CreateGroupRequest create_group = 3;
    CreateTaskRequest create_task = 4;
    CreateTerminalRequest create_terminal = 5;
    CreateCodexRequest create_codex = 25;
    TerminalInput terminal_input = 6;
    TerminalResize terminal_resize = 7;
    CloseSessionRequest close_session = 8;
    SubscribeEventsRequest subscribe_events = 9;
    UpdateGroupRequest update_group = 10;
    SetGroupArchivedRequest set_group_archived = 11;
    DeleteGroupRequest delete_group = 12;
    UpdateTaskRequest update_task = 13;
    SetTaskArchivedRequest set_task_archived = 14;
    DeleteTaskRequest delete_task = 15;
    AttachTerminalRequest attach_terminal = 16;
    DetachTerminalRequest detach_terminal = 17;
    HelloRequest hello = 18;
    RestartTerminalRequest restart_terminal = 19;
    UpdatePageRequest update_page = 20;
    DeletePageRequest delete_page = 21;
    MoveGroupRequest move_group = 22;
    MoveTaskRequest move_task = 29;
    MovePageRequest move_page = 30;
    RenamePageRequest rename_page = 31;
    SetPageArchivedRequest set_page_archived = 32;
    SetTaskStatusRequest set_task_status = 33;
    ListFilesRequest list_files = 26;
    ReadFileRequest read_file = 27;
    WriteFileRequest write_file = 28;
  }
  uint64 expected_revision = 23;
  bool has_expected_revision = 24;
}

message Response {
  string request_id = 1;
  oneof body {
    WorkspaceSnapshot snapshot = 2;
    EntityRef accepted = 3;
    Error error = 4;
    TerminalAttachment terminal_attachment = 5;
    HelloResponse hello = 6;
    FileListResponse file_list = 8;
    FileReadResponse file_read = 9;
    FileWriteResponse file_write = 10;
  }
  uint64 workspace_revision = 7;
}

message HelloResponse {
  uint32 protocol_version = 1;
  string agent_version = 2;
  uint64 capabilities = 3;
  string workspace_id = 4;
}

message TerminalAttachment {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  uint32 status = 4;
  bytes replay_data = 5;
  uint64 replay_start_offset = 6;
  uint64 replay_end_offset = 7;
}

message FileListResponse {
  repeated FileEntry entries = 1;
  string root_uri = 2;
  string version = 3;
}

message FileReadResponse {
  bytes data = 1;
  string version = 2;
  bool eof = 3;
}

message FileWriteResponse {
  string version = 1;
}

message WorkspaceChanged {
  WorkspaceSnapshot snapshot = 1;
}

message TerminalOutput {
  string terminal_id = 1;
  bytes data = 2;
  bool final_chunk = 3;
  uint64 start_offset = 4;
  uint64 end_offset = 5;
}

message TerminalStatusChanged {
  string terminal_id = 1;
  uint32 status = 2;
  string message = 3;
}

message Event {
  uint64 sequence = 1;
  oneof body {
    WorkspaceChanged workspace_changed = 2;
    TerminalOutput terminal_output = 3;
    TerminalStatusChanged terminal_status_changed = 4;
  }
}
